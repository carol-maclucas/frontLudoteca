<div class="container">
    <h1>Listado de Autores</h1>

    @if (errorMessage()) {
        <p class="error-message">{{ errorMessage() }}</p>
    }

    <mat-table [dataSource]="dataSource"> 
        <ng-container matColumnDef="id"> <!-- definimos la columna1 Id-->
            <mat-header-cell *matHeaderCellDef> Identificador </mat-header-cell>
            <mat-cell *matCellDef="let element"> {{element.id}} </mat-cell>
        </ng-container>

        <ng-container matColumnDef="name">  <!-- definimos la columna2 NombreAutor-->
            <mat-header-cell *matHeaderCellDef> Nombre autor  </mat-header-cell>
            <mat-cell *matCellDef="let element"> {{element.name}} </mat-cell>
        </ng-container>

        <ng-container matColumnDef="nationality">  <!-- definimos la columna3 Nacionalidad-->
            <mat-header-cell *matHeaderCellDef> Nacionalidad  </mat-header-cell>
            <mat-cell *matCellDef="let element"> {{element.nationality}} </mat-cell>
        </ng-container>

        <ng-container matColumnDef="action">
            <mat-header-cell *matHeaderCellDef><!--(Columna acciones sin nombre)--></mat-header-cell>
            <mat-cell *matCellDef="let element"> <!--se ponen en paralelo verticalmente-->
                <button mat-icon-button style="color:rgb(10, 90, 155)" (click)="editAuthor(element)">
                    <mat-icon>edit</mat-icon>
                </button>
                <button mat-icon-button style="color:rgb(209, 28, 28)" (click)="deleteAuthor(element)">
                    <mat-icon>clear</mat-icon>
                </button>
            </mat-cell>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></mat-header-row>
        <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>
    </mat-table> 
    <!--PAGINADO-->
    <mat-paginator (page)="loadPage($event)" [pageSizeOptions]="[5, 10, 20]" [pageIndex]="pageNumber" [pageSize]="pageSize" [length]="totalElements" showFirstLastButtons></mat-paginator>

    <div class="buttons">
        <button mat-flat-button color="primary" (click)="createAuthor()">Nuevo autor</button> 
    </div>   
</div>
