<div class="container">
    <h1>{{title()}}</h1>
    <div [innerHTML]="description()" class="description"></div>
    @if (errorMessage()) {
        <p class="error-message" role="alert">{{errorMessage()}}</p>
    }

    <div class="buttons">
        <button mat-stroked-button [disabled]="isConfirming()" (click)="onClose()">No</button>
        <button mat-flat-button color="primary" [disabled]="isConfirming()" (click)="onConfirm()">Sí</button>
    </div>
</div>
